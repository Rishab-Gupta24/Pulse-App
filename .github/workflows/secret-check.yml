# Re-runs the secret check on GitHub, since local hooks can be skipped or not installed.
name: Secret check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.mjs --all
